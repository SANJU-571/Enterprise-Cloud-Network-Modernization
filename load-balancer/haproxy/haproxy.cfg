# =============================================================================
# HAProxy - on-prem load balancer pair (LB-01 / LB-02) for internal services
# Runs active/passive behind a keepalived VIP (10.10.100.10).
#
# Tuning from the SLA remediation plan (task 1.1):
#   * maxconn raised and sized from measured peak (was hitting 95% capacity)
#   * nbthread = cores (replaces the old nbproc model)
#   * leastconn instead of roundrobin for long-lived API sessions
#   * health checks hit /healthz so failed backends drop out within ~6 s
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

    maxconn 60000
    nbthread 8
    cpu-map auto:1/1-8 0-7

    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    option  redispatch
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 10s
    maxconn 50000

# ---------------------------------------------------------------- Stats + Prometheus
frontend stats
    bind 10.10.100.10:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    acl it_vlan src 10.10.40.0/24 10.10.100.40/32
    http-request deny unless it_vlan

# ---------------------------------------------------------------- Internal portal
frontend fe_portal
    bind 10.10.100.10:80
    bind 10.10.100.10:443 ssl crt /etc/haproxy/certs/portal.pem alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-Frame-Options DENY

    # Basic abuse protection: 100 req / 10 s per source
    stick-table type ip size 200k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    acl is_api path_beg /api/
    use_backend be_api if is_api
    default_backend be_web

backend be_web
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 2000 slowstart 30s
    server web-01 10.10.100.61:8080 check
    server web-02 10.10.100.62:8080 check
    server web-03 10.10.100.63:8080 check

backend be_api
    balance leastconn
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 1500 slowstart 30s
    timeout server 60s
    server api-01 10.10.100.71:8080 check
    server api-02 10.10.100.72:8080 check
    server api-03 10.10.100.73:8080 check
    # Burst capacity in AWS over the VPN - used only if all local servers are down
    server aws-alb internal-portal.prod.stratos.internal:443 ssl verify required ca-file /etc/ssl/certs/ca-bundle.crt check backup
