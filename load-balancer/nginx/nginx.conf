# =============================================================================
# NGINX - reverse proxy in the DMZ (172.16.10.0/24)
# Tuned per task 1.1: worker_processes = cores, worker_connections raised,
# keepalive pools to upstreams, micro-caching for anonymous GETs to cut
# response time on hot pages.
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format timed '$remote_addr - [$time_local] "$request" $status '
                     '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                     'cache=$upstream_cache_status';
    access_log /var/log/nginx/access.log timed buffer=32k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # Micro-cache: 1 s for anonymous GETs smooths bursts without stale data
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=micro:50m max_size=1g inactive=10m use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=perip:20m rate=20r/s;

    upstream portal_backend {
        least_conn;
        server 10.10.100.10:443 max_fails=3 fail_timeout=10s;   # HAProxy VIP
        keepalive 64;
    }

    server {
        listen 80;
        server_name portal.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name portal.example.com;

        ssl_certificate     /etc/nginx/certs/portal.crt;
        ssl_certificate_key /etc/nginx/certs/portal.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1h;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=perip burst=40 nodelay;

            proxy_cache micro;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_bypass $http_authorization $cookie_session;
            proxy_no_cache $http_authorization $cookie_session;

            proxy_pass https://portal_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
