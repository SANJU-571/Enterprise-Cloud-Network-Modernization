# =============================================================================
# keepalived - LB-01 (MASTER)
# Removes the load balancer single point of failure flagged in the SLA review.
# VIP 10.10.100.10 floats between LB-01 (priority 150) and LB-02 (priority 100).
# If HAProxy dies on LB-01 the check script drops its priority by 60, so LB-02
# takes the VIP within ~3 seconds.
# LB-02 uses the same file with: state BACKUP, priority 100, unicast_src_ip
# 10.10.100.9 and unicast_peer 10.10.100.8.
# =============================================================================

global_defs {
    router_id LB-01
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_haproxy {
    script "/usr/bin/systemctl is-active --quiet haproxy"
    interval 1
    timeout 2
    fall 2
    rise 2
    weight -60
}

vrrp_instance VI_PORTAL {
    state MASTER
    interface ens192
    virtual_router_id 51
    priority 150
    advert_int 1
    preempt_delay 30

    unicast_src_ip 10.10.100.8
    unicast_peer {
        10.10.100.9
    }

    authentication {
        auth_type PASS
        auth_pass <REDACTED>
    }

    virtual_ipaddress {
        10.10.100.10/24 dev ens192 label ens192:vip
    }

    track_script {
        chk_haproxy
    }

    notify_master "/usr/local/bin/lb-notify.sh MASTER"
    notify_backup "/usr/local/bin/lb-notify.sh BACKUP"
    notify_fault  "/usr/local/bin/lb-notify.sh FAULT"
}
