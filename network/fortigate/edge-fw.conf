# =============================================================================
# EDGE-FW - FortiGate 100F (NGFW, perimeter + zone firewall)
# Zones:
#   WAN1    port1  -> EDGE-ISR (ISP-1 via router)
#   WAN2    wan2   -> ISP-2 direct (backup)
#   CORE    port3/port4 -> CORE-SW1 / CORE-SW2 (routed /30s, OSPF)
#   DMZ     port5  -> reverse proxy / public services
#   SSLVPN  ssl.root -> remote workers (MFA via RADIUS/AD)
# Features: IPS, AV, web filter, application control, SD-WAN failover,
#           SSL-VPN with FortiToken MFA, logging to syslog/SIEM.
# Secrets are placeholders.
# =============================================================================

config system global
    set hostname "EDGE-FW"
    set timezone 12
    set admin-sport 8443
    set admin-ssh-port 22
    set admintimeout 10
    set strong-crypto enable
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
end

config system admin
    edit "netadmin"
        set accprofile "super_admin"
        set trusthost1 10.10.40.0 255.255.255.0
        set two-factor fortitoken
        set password <REDACTED>
    next
end

config system interface
    edit "port1"
        set alias "WAN1-ISR"
        set ip 10.10.255.10 255.255.255.252
        set allowaccess ping
        set role wan
    next
    edit "wan2"
        set alias "WAN2-ISP2"
        set mode static
        set ip 198.51.100.20 255.255.255.248
        set allowaccess ping
        set role wan
    next
    edit "port3"
        set alias "CORE-SW1"
        set ip 10.10.255.2 255.255.255.252
        set allowaccess ping snmp
        set role lan
    next
    edit "port4"
        set alias "CORE-SW2"
        set ip 10.10.255.6 255.255.255.252
        set allowaccess ping snmp
        set role lan
    next
    edit "port5"
        set alias "DMZ"
        set ip 172.16.10.1 255.255.255.0
        set allowaccess ping
        set role dmz
    next
end

config system zone
    edit "CORE"
        set interface "port3" "port4"
        set intrazone deny
    next
end

# ---------------------------------------------------------------- SD-WAN
config system sdwan
    set status enable
    config zone
        edit "virtual-wan-link"
        next
    end
    config members
        edit 1
            set interface "port1"
            set gateway 10.10.255.9
            set priority 1
        next
        edit 2
            set interface "wan2"
            set gateway 198.51.100.17
            set priority 10
        next
    end
    config health-check
        edit "internet"
            set server "1.1.1.1" "8.8.8.8"
            set protocol ping
            set interval 1000
            set failtime 3
            set recoverytime 5
            set members 1 2
            config sla
                edit 1
                    set latency-threshold 100
                    set jitter-threshold 30
                    set packetloss-threshold 1
                next
            end
        next
    end
    config service
        edit 1
            set name "default-failover"
            set mode sla
            set dst "all"
            set src "all"
            config sla
                edit "internet"
                    set id 1
                next
            end
            set priority-members 1 2
        next
    end
end

config router static
    edit 1
        set distance 1
        set sdwan-zone "virtual-wan-link"
    next
end

# ---------------------------------------------------------------- OSPF
config router ospf
    set router-id 10.10.255.2
    config area
        edit 0.0.0.0
        next
    end
    config ospf-interface
        edit "core1"
            set interface "port3"
            set network-type point-to-point
            set authentication md5
            set md5-keys 1 <REDACTED>
        next
        edit "core2"
            set interface "port4"
            set network-type point-to-point
            set authentication md5
            set md5-keys 1 <REDACTED>
        next
        edit "isr"
            set interface "port1"
            set network-type point-to-point
            set authentication md5
            set md5-keys 1 <REDACTED>
        next
    end
    config network
        edit 1
            set prefix 10.10.255.0 255.255.255.240
        next
    end
end

# ---------------------------------------------------------------- Addresses
config firewall address
    edit "NET-SALES"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "NET-FINANCE"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "NET-ADMIN"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "NET-IT"
        set subnet 10.10.40.0 255.255.255.0
    next
    edit "NET-OPS"
        set subnet 10.10.50.0 255.255.255.0
    next
    edit "NET-GUEST"
        set subnet 10.10.60.0 255.255.255.0
    next
    edit "NET-SERVERS"
        set subnet 10.10.100.0 255.255.255.0
    next
    edit "NET-AWS-PROD"
        set subnet 10.20.0.0 255.255.0.0
    next
    edit "NET-AWS-DR"
        set subnet 10.30.0.0 255.255.0.0
    next
    edit "NET-RFC1918-10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "NET-SSLVPN-POOL"
        set type iprange
        set start-ip 10.10.200.10
        set end-ip 10.10.200.250
    next
end

config firewall addrgrp
    edit "GRP-CORPORATE"
        set member "NET-SALES" "NET-FINANCE" "NET-ADMIN" "NET-IT" "NET-OPS"
    next
    edit "GRP-AWS"
        set member "NET-AWS-PROD" "NET-AWS-DR"
    next
end

# ---------------------------------------------------------------- Security profiles
config ips sensor
    edit "STRATOS-IPS"
        set comment "Block critical/high, monitor medium"
        config entries
            edit 1
                set severity high critical
                set status enable
                set action block
            next
            edit 2
                set severity medium
                set status enable
                set action pass
                set log-packet enable
            next
        end
    next
end

config webfilter profile
    edit "STRATOS-WEB"
        config ftgd-wf
            config filters
                edit 1
                    set category 26
                    set action block
                next
                edit 2
                    set category 61
                    set action block
                next
            end
        end
    next
end

# ---------------------------------------------------------------- Policies
config firewall policy
    edit 10
        set name "Corporate-to-Internet"
        set srcintf "CORE"
        set dstintf "virtual-wan-link"
        set srcaddr "GRP-CORPORATE"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "NTP"
        set utm-status enable
        set ips-sensor "STRATOS-IPS"
        set webfilter-profile "STRATOS-WEB"
        set av-profile "default"
        set application-list "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
        set nat enable
    next
    edit 20
        set name "Guest-to-Internet-only"
        set srcintf "CORE"
        set dstintf "virtual-wan-link"
        set srcaddr "NET-GUEST"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set utm-status enable
        set webfilter-profile "STRATOS-WEB"
        set traffic-shaper "guest-10mbps"
        set logtraffic all
        set nat enable
    next
    edit 30
        set name "Deny-Guest-to-Internal"
        set srcintf "CORE"
        set dstintf "any"
        set srcaddr "NET-GUEST"
        set dstaddr "NET-RFC1918-10"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
    edit 40
        set name "Corporate-to-AWS-over-VPN"
        set comment "Traffic to AWS is routed via EDGE-ISR tunnels; inspected here"
        set srcintf "CORE"
        set dstintf "port1"
        set srcaddr "GRP-CORPORATE" "NET-SERVERS"
        set dstaddr "GRP-AWS"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "PostgreSQL" "Redis"
        set utm-status enable
        set ips-sensor "STRATOS-IPS"
        set logtraffic all
        set nat disable
    next
    edit 50
        set name "SSLVPN-to-Corporate"
        set srcintf "ssl.root"
        set dstintf "CORE"
        set srcaddr "NET-SSLVPN-POOL"
        set dstaddr "NET-SERVERS" "GRP-CORPORATE"
        set groups "VPN-Users"
        set action accept
        set schedule "always"
        set service "HTTPS" "RDP" "SMB" "DNS"
        set utm-status enable
        set ips-sensor "STRATOS-IPS"
        set logtraffic all
    next
    edit 999
        set name "Explicit-Deny-Log"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config firewall service custom
    edit "PostgreSQL"
        set tcp-portrange 5432
    next
    edit "Redis"
        set tcp-portrange 6379
    next
end

config firewall shaper traffic-shaper
    edit "guest-10mbps"
        set maximum-bandwidth 10240
        set per-policy enable
    next
end

# ---------------------------------------------------------------- SSL-VPN + MFA
config user radius
    edit "ISE-01"
        set server "10.10.100.20"
        set secret <REDACTED>
        set auth-type ms_chap_v2
    next
end

config user group
    edit "VPN-Users"
        set member "ISE-01"
        config match
            edit 1
                set server-name "ISE-01"
                set group-name "GG-VPN-Users"
            next
        end
    next
end

config vpn ssl settings
    set servercert "corp-vpn-cert"
    set tunnel-ip-pools "NET-SSLVPN-POOL"
    set dns-server1 10.10.100.11
    set dns-server2 10.10.100.12
    set source-interface "virtual-wan-link"
    set source-address "all"
    set default-portal "full-access"
    set login-attempt-limit 3
    set login-block-time 300
    set idle-timeout 900
    set ssl-min-proto-ver tls1-2
    set port 10443
    config authentication-rule
        edit 1
            set groups "VPN-Users"
            set portal "full-access"
        next
    end
end

# ---------------------------------------------------------------- Logging
config log syslogd setting
    set status enable
    set server "10.10.100.30"
    set mode reliable
    set format rfc5424
end
