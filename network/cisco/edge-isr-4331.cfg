! =============================================================================
! EDGE-ISR - Cisco ISR 4331 (internet edge, ISP-1, AWS VPN termination)
! - ISP-1 primary on Gi0/0/0; ISP-2 terminates on the FortiGate WAN2
! - IP SLA tracks ISP-1 reachability; default route withdrawn on failure so
!   the FortiGate fails over to ISP-2
! - Two route-based IPsec tunnels (VTI) to the AWS VGW with BGP. On-prem
!   10.10.0.0/16 is advertised; AWS VPC prefixes are learned and redistributed
!   into OSPF towards the core.
! - QoS: voice/video (EF/AF41) prioritised outbound on the WAN.
! Tunnel addresses / PSKs come from `terraform output vpn_tunnel_addresses`.
! =============================================================================
hostname EDGE-ISR
!
service password-encryption
no ip http server
no ip http secure-server
ip domain name corp.example.local
enable algorithm-type scrypt secret <REDACTED>
username netadmin privilege 15 algorithm-type scrypt secret <REDACTED>
!
! ---------------------------------------------------------------- Interfaces
interface GigabitEthernet0/0/0
 description ISP-1 WAN
 ip address 203.0.113.10 255.255.255.248
 ip nat outside
 ip access-group ACL-WAN-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 service-policy output QOS-WAN-OUT
 negotiation auto
!
interface GigabitEthernet0/0/1
 description EDGE-FW port1 (inside transit)
 ip address 10.10.255.9 255.255.255.252
 ip nat inside
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
!
! ---------------------------------------------------------------- ISP-1 tracking
ip sla 1
 icmp-echo 203.0.113.9 source-interface GigabitEthernet0/0/0
 frequency 5
ip sla schedule 1 life forever start-time now
track 10 ip sla 1 reachability
 delay down 15 up 30
!
ip route 0.0.0.0 0.0.0.0 203.0.113.9 track 10
!
! ---------------------------------------------------------------- NAT (PAT)
ip access-list standard ACL-NAT-INSIDE
 permit 10.10.0.0 0.0.255.255
!
route-map RM-NAT permit 10
 match ip address ACL-NAT-INSIDE
 match interface GigabitEthernet0/0/0
!
ip nat inside source route-map RM-NAT interface GigabitEthernet0/0/0 overload
!
! ---------------------------------------------------------------- IPsec to AWS
crypto ikev2 proposal AWS-PROP
 encryption aes-cbc-256
 integrity sha256
 group 20
!
crypto ikev2 policy AWS-POL
 proposal AWS-PROP
!
crypto ikev2 keyring AWS-KEYS
 peer AWS-T1
  address <AWS_TUNNEL1_OUTSIDE_IP>
  pre-shared-key <REDACTED>
 peer AWS-T2
  address <AWS_TUNNEL2_OUTSIDE_IP>
  pre-shared-key <REDACTED>
!
crypto ikev2 profile AWS-IKE
 match identity remote address <AWS_TUNNEL1_OUTSIDE_IP> 255.255.255.255
 match identity remote address <AWS_TUNNEL2_OUTSIDE_IP> 255.255.255.255
 identity local address 203.0.113.10
 authentication remote pre-share
 authentication local pre-share
 keyring local AWS-KEYS
 lifetime 28800
 dpd 10 3 on-demand
!
crypto ipsec transform-set AWS-TS esp-aes 256 esp-sha256-hmac
 mode tunnel
!
crypto ipsec profile AWS-IPSEC
 set transform-set AWS-TS
 set pfs group20
 set ikev2-profile AWS-IKE
 set security-association lifetime seconds 3600
!
interface Tunnel1
 description AWS VGW tunnel 1
 ip address 169.254.10.2 255.255.255.252
 ip tcp adjust-mss 1379
 tunnel source GigabitEthernet0/0/0
 tunnel mode ipsec ipv4
 tunnel destination <AWS_TUNNEL1_OUTSIDE_IP>
 tunnel protection ipsec profile AWS-IPSEC
!
interface Tunnel2
 description AWS VGW tunnel 2
 ip address 169.254.10.6 255.255.255.252
 ip tcp adjust-mss 1379
 tunnel source GigabitEthernet0/0/0
 tunnel mode ipsec ipv4
 tunnel destination <AWS_TUNNEL2_OUTSIDE_IP>
 tunnel protection ipsec profile AWS-IPSEC
!
! ---------------------------------------------------------------- BGP to AWS
ip prefix-list PL-ONPREM-OUT seq 10 permit 10.10.0.0/16
ip prefix-list PL-AWS-IN seq 10 permit 10.20.0.0/16
ip prefix-list PL-AWS-IN seq 20 permit 10.30.0.0/16
!
router bgp 65010
 bgp router-id 10.10.255.9
 bgp log-neighbor-changes
 neighbor 169.254.10.1 remote-as 64512
 neighbor 169.254.10.1 description AWS-PROD-T1
 neighbor 169.254.10.1 timers 10 30
 neighbor 169.254.10.5 remote-as 64512
 neighbor 169.254.10.5 description AWS-PROD-T2
 neighbor 169.254.10.5 timers 10 30
 !
 address-family ipv4
  network 10.10.0.0 mask 255.255.0.0
  neighbor 169.254.10.1 activate
  neighbor 169.254.10.1 prefix-list PL-ONPREM-OUT out
  neighbor 169.254.10.1 prefix-list PL-AWS-IN in
  neighbor 169.254.10.5 activate
  neighbor 169.254.10.5 prefix-list PL-ONPREM-OUT out
  neighbor 169.254.10.5 prefix-list PL-AWS-IN in
  maximum-paths 2
 exit-address-family
!
ip route 10.10.0.0 255.255.0.0 Null0 254
!
! ---------------------------------------------------------------- OSPF
router ospf 10
 router-id 10.10.255.9
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 network 10.10.255.8 0.0.0.3 area 0
 redistribute bgp 65010 subnets route-map RM-BGP-TO-OSPF
 default-information originate metric 10 metric-type 2
!
route-map RM-BGP-TO-OSPF permit 10
 match ip address prefix-list PL-AWS-IN
!
! ---------------------------------------------------------------- QoS
class-map match-any CM-VOICE
 match dscp ef
class-map match-any CM-VIDEO
 match dscp af41
class-map match-any CM-CRITICAL
 match dscp af31
!
policy-map QOS-CHILD
 class CM-VOICE
  priority percent 15
 class CM-VIDEO
  bandwidth remaining percent 30
 class CM-CRITICAL
  bandwidth remaining percent 30
 class class-default
  fair-queue
!
policy-map QOS-WAN-OUT
 class class-default
  shape average 500000000
  service-policy QOS-CHILD
!
! ---------------------------------------------------------------- WAN ACL
ip access-list extended ACL-WAN-IN
 remark --- anti-spoofing
 deny   ip 10.0.0.0 0.255.255.255 any
 deny   ip 172.16.0.0 0.15.255.255 any
 deny   ip 192.168.0.0 0.0.255.255 any
 deny   ip 127.0.0.0 0.255.255.255 any
 remark --- IPsec from AWS
 permit udp host <AWS_TUNNEL1_OUTSIDE_IP> host 203.0.113.10 eq isakmp
 permit udp host <AWS_TUNNEL1_OUTSIDE_IP> host 203.0.113.10 eq non500-isakmp
 permit esp host <AWS_TUNNEL1_OUTSIDE_IP> host 203.0.113.10
 permit udp host <AWS_TUNNEL2_OUTSIDE_IP> host 203.0.113.10 eq isakmp
 permit udp host <AWS_TUNNEL2_OUTSIDE_IP> host 203.0.113.10 eq non500-isakmp
 permit esp host <AWS_TUNNEL2_OUTSIDE_IP> host 203.0.113.10
 remark --- return traffic and ISP SLA probe
 permit icmp host 203.0.113.9 host 203.0.113.10 echo-reply
 permit tcp any host 203.0.113.10 established
 permit udp any eq domain host 203.0.113.10
 permit udp any eq ntp host 203.0.113.10
 permit udp any eq 443 host 203.0.113.10
 permit icmp any host 203.0.113.10 echo-reply
 permit icmp any host 203.0.113.10 unreachable
 permit icmp any host 203.0.113.10 time-exceeded
 permit icmp any host 203.0.113.10 packet-too-big
 remark --- deep stateful inspection / IPS is done on the FortiGate behind this router
 deny   ip any any log
!
! ---------------------------------------------------------------- Management
ip access-list standard ACL-VTY
 permit 10.10.40.0 0.0.0.255
 deny   any log
!
ip ssh version 2
crypto key generate rsa modulus 4096
line vty 0 4
 access-class ACL-VTY in
 transport input ssh
 exec-timeout 10 0
!
logging host 10.10.100.30
ntp server 10.10.100.11
end
