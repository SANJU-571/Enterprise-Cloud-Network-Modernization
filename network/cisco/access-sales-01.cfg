! =============================================================================
! ACC-SALES-01 - Cisco Catalyst 2960-X (access layer)
! Uplinks: Po10 -> CORE-SW1, Po11 -> CORE-SW2 (LACP, 2 x 10G each)
! Ports  : Gi1/0/1-36 Sales users (VLAN 10), Gi1/0/37-44 Operations (VLAN 50),
!          Gi1/0/45-46 Meraki APs (trunk 10,50,60,99), Gi1/0/47-48 spare
! Hardening: 802.1X (MAB fallback), port-security, BPDU guard, DHCP snooping,
!            Dynamic ARP Inspection, IP Source Guard, storm control.
! =============================================================================
hostname ACC-SALES-01
!
service password-encryption
no ip http server
no ip http secure-server
ip domain name corp.example.local
enable algorithm-type scrypt secret <REDACTED>
username netadmin privilege 15 algorithm-type scrypt secret <REDACTED>
!
aaa new-model
radius server ISE-01
 address ipv4 10.10.100.20 auth-port 1812 acct-port 1813
 key <REDACTED>
aaa group server radius RAD-SERVERS
 server name ISE-01
aaa authentication login default group RAD-SERVERS local
aaa authentication dot1x default group RAD-SERVERS
aaa authorization network default group RAD-SERVERS
aaa accounting dot1x default start-stop group RAD-SERVERS
dot1x system-auth-control
!
vlan 10
 name SALES
vlan 50
 name OPERATIONS
vlan 60
 name GUEST
vlan 99
 name MGMT
vlan 999
 name BLACKHOLE
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
! ---------------------------------------------------------------- L2 security
ip dhcp snooping vlan 10,50,60
no ip dhcp snooping information option
ip dhcp snooping
ip arp inspection vlan 10,50,60
!
! ---------------------------------------------------------------- Uplinks
interface range TenGigabitEthernet1/0/1 - 2
 description PO10 member -> CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
 channel-group 10 mode active
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range TenGigabitEthernet1/0/3 - 4
 description PO11 member -> CORE-SW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
 channel-group 11 mode active
 ip dhcp snooping trust
 ip arp inspection trust
!
interface Port-channel10
 description CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
 ip dhcp snooping trust
 ip arp inspection trust
!
interface Port-channel11
 description CORE-SW2
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
 ip dhcp snooping trust
 ip arp inspection trust
!
! ---------------------------------------------------------------- Sales users
interface range GigabitEthernet1/0/1 - 36
 description SALES-USER
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security aging time 10
 authentication port-control auto
 authentication order dot1x mab
 authentication priority dot1x mab
 authentication event fail action next-method
 authentication violation restrict
 mab
 dot1x pae authenticator
 dot1x timeout tx-period 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 storm-control multicast level 5.00
 ip verify source
 no shutdown
!
! ---------------------------------------------------------------- Operations users
interface range GigabitEthernet1/0/37 - 44
 description OPS-USER
 switchport mode access
 switchport access vlan 50
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 authentication port-control auto
 authentication order dot1x mab
 mab
 dot1x pae authenticator
 spanning-tree portfast
 spanning-tree bpduguard enable
 storm-control broadcast level 5.00
 ip verify source
 no shutdown
!
! ---------------------------------------------------------------- Access points
interface range GigabitEthernet1/0/45 - 46
 description MERAKI-AP (PoE+)
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,60,99
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 power inline auto
 no shutdown
!
! ---------------------------------------------------------------- Spare
interface range GigabitEthernet1/0/47 - 48
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description MGMT
 ip address 10.10.99.21 255.255.255.0
!
ip default-gateway 10.10.99.1
!
ip access-list standard ACL-VTY
 permit 10.10.40.0 0.0.0.255
 deny   any log
!
ip ssh version 2
crypto key generate rsa modulus 4096
line con 0
 exec-timeout 5 0
line vty 0 15
 access-class ACL-VTY in
 exec-timeout 10 0
 transport input ssh
!
logging host 10.10.100.30
ntp server 10.10.100.11
end
