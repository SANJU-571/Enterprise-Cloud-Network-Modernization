! =============================================================================
! CORE-SW2 - Cisco Catalyst 9300 (Layer 3 core / distribution, collapsed)
! Role   : HSRP STANDBY for all user VLANs, OSPF area 0, STP root secondary
! Peer   : CORE-SW1 via Port-channel1 (LACP, 2 x 10G)
! Uplink : EDGE-FW (FortiGate) via Gi1/0/48 (routed /30)
! Secrets are placeholders - real values live in the password vault.
! =============================================================================
hostname CORE-SW2
!
service password-encryption
service timestamps log datetime msec localtime show-timezone
no ip http server
no ip http secure-server
no ip domain lookup
ip domain name corp.example.local
clock timezone EST -5 0
clock summer-time EDT recurring
!
enable algorithm-type scrypt secret <REDACTED>
username netadmin privilege 15 algorithm-type scrypt secret <REDACTED>
!
! ---------------------------------------------------------------- AAA / RADIUS
aaa new-model
radius server ISE-01
 address ipv4 10.10.100.20 auth-port 1812 acct-port 1813
 key <REDACTED>
aaa group server radius RAD-SERVERS
 server name ISE-01
aaa authentication login default group RAD-SERVERS local
aaa authorization exec default group RAD-SERVERS local
aaa accounting exec default start-stop group RAD-SERVERS
!
! ---------------------------------------------------------------- VLANs
vlan 10
 name SALES
vlan 20
 name FINANCE
vlan 30
 name ADMIN
vlan 40
 name IT
vlan 50
 name OPERATIONS
vlan 60
 name GUEST
vlan 99
 name MGMT
vlan 100
 name SERVERS
vlan 999
 name BLACKHOLE
!
! ---------------------------------------------------------------- Spanning tree
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,30,40,50,60,99,100 root secondary
spanning-tree loopguard default
!
! ---------------------------------------------------------------- Inter-switch link
interface range TenGigabitEthernet1/1/1 - 2
 description PO1 member -> CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,100
 channel-group 1 mode active
!
interface Port-channel1
 description CORE-SW1 (LACP)
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99,100
!
! ---------------------------------------------------------------- Access uplinks
interface range TenGigabitEthernet1/1/3 - 4
 description PO11 member -> ACC-SALES-01
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
 channel-group 11 mode active
!
interface Port-channel11
 description ACC-SALES-01
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,50,60,99
!
! ---------------------------------------------------------------- SVIs + HSRP
! HSRP: CORE-SW2 priority 100 (standby). Becomes active if CORE-SW1 fails or its
! firewall uplink goes down (CORE-SW1 tracks and decrements to 90).
!
interface Vlan10
 description SALES
 ip address 10.10.10.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip helper-address 10.10.100.12
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 standby 10 preempt delay minimum 30
 standby 10 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan20
 description FINANCE
 ip address 10.10.20.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip helper-address 10.10.100.12
 ip access-group ACL-FINANCE-IN in
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt delay minimum 30
 standby 20 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan30
 description ADMIN
 ip address 10.10.30.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip helper-address 10.10.100.12
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 100
 standby 30 preempt delay minimum 30
 standby 30 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan40
 description IT
 ip address 10.10.40.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip helper-address 10.10.100.12
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 100
 standby 40 preempt delay minimum 30
 standby 40 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan50
 description OPERATIONS
 ip address 10.10.50.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip helper-address 10.10.100.12
 standby version 2
 standby 50 ip 10.10.50.1
 standby 50 priority 100
 standby 50 preempt delay minimum 30
 standby 50 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan60
 description GUEST
 ip address 10.10.60.3 255.255.255.0
 ip helper-address 10.10.100.11
 ip access-group ACL-GUEST-IN in
 standby version 2
 standby 60 ip 10.10.60.1
 standby 60 priority 100
 standby 60 preempt delay minimum 30
 standby 60 authentication md5 key-string <REDACTED>
 no ip redirects
!
interface Vlan99
 description MGMT
 ip address 10.10.99.3 255.255.255.0
 standby version 2
 standby 99 ip 10.10.99.1
 standby 99 priority 100
 standby 99 preempt
 no ip redirects
!
interface Vlan100
 description SERVERS
 ip address 10.10.100.3 255.255.255.0
 standby version 2
 standby 100 ip 10.10.100.1
 standby 100 priority 100
 standby 100 preempt
 no ip redirects
!
! ---------------------------------------------------------------- Routed uplink
interface GigabitEthernet1/0/48
 description EDGE-FW port4
 no switchport
 ip address 10.10.255.5 255.255.255.252
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 <REDACTED>
!
! ---------------------------------------------------------------- Unused ports
interface range GigabitEthernet1/0/1 - 46
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
! ---------------------------------------------------------------- OSPF
router ospf 10
 router-id 10.10.99.3
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0/48
 no passive-interface Vlan99
 network 10.10.0.0 0.0.255.255 area 0
 timers throttle spf 50 200 5000
!
! ---------------------------------------------------------------- ACLs
! Finance may reach finance servers, DNS/DHCP/AD and the internet (via FW);
! nothing else internal.
ip access-list extended ACL-FINANCE-IN
 remark --- core services
 permit udp 10.10.20.0 0.0.0.255 host 10.10.100.11 eq domain
 permit udp 10.10.20.0 0.0.0.255 host 10.10.100.12 eq domain
 permit udp any any eq bootps
 permit tcp 10.10.20.0 0.0.0.255 10.10.100.0 0.0.0.255 eq 88 389 445 636
 remark --- finance app in AWS (app tier)
 permit tcp 10.10.20.0 0.0.0.255 10.20.64.0 0.0.63.255 eq 443
 remark --- block other internal ranges
 deny   ip 10.10.20.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny   ip 10.10.20.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny   ip 10.10.20.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 10.10.20.0 0.0.0.255 any
!
! Guest: DHCP/DNS only internally, then internet
ip access-list extended ACL-GUEST-IN
 permit udp any any eq bootps
 permit udp 10.10.60.0 0.0.0.255 host 10.10.100.11 eq domain
 deny   ip 10.10.60.0 0.0.0.255 10.0.0.0 0.255.255.255 log
 deny   ip 10.10.60.0 0.0.0.255 172.16.0.0 0.15.255.255 log
 deny   ip 10.10.60.0 0.0.0.255 192.168.0.0 0.0.255.255 log
 permit ip 10.10.60.0 0.0.0.255 any
!
! VTY: SSH only, IT VLAN only
ip access-list standard ACL-VTY
 permit 10.10.40.0 0.0.0.255
 deny   any log
!
! ---------------------------------------------------------------- Management
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
crypto key generate rsa modulus 4096
!
line con 0
 exec-timeout 5 0
 logging synchronous
line vty 0 15
 access-class ACL-VTY in
 exec-timeout 10 0
 transport input ssh
 transport output none
!
logging host 10.10.100.30
logging trap informational
logging buffered 64000
ntp server 10.10.100.11
snmp-server group MONITOR v3 priv read MON-VIEW access ACL-VTY
snmp-server view MON-VIEW iso included
snmp-server user prometheus MONITOR v3 auth sha <REDACTED> priv aes 256 <REDACTED>
!
banner login ^
Authorised access only. Activity is logged and monitored.
^
end
