# SLA-driven alert rules (action plan task 3.2)
# Thresholds fire *before* the SLA is breached so there is time to act.
#
#   SLA                             Warning rule here
#   uptime >= 99.5%                 probe failing 2m / 30d availability < 99.6%
#   response <= 200 ms (p95)        p95 > 180 ms for 5m
#   LB capacity <= 85%              session utilisation > 80% for 10m
#   errors <= 10/day                > 8 5xx in rolling 24h
#   inter-region latency <= 100 ms  avg RTT > 90 ms for 10m
#   server CPU / memory             CPU > 70% or memory > 80% for 15m

groups:
  - name: sla-recording
    interval: 30s
    rules:
      - record: sla:probe_success:ratio_30d
        expr: avg_over_time(probe_success{job="blackbox-http"}[30d])

      - record: sla:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))

      - record: sla:haproxy_session_utilisation:ratio
        expr: |
          sum by (proxy) (haproxy_frontend_current_sessions)
            / sum by (proxy) (haproxy_frontend_limit_sessions)

  - name: sla-alerts
    rules:
      - alert: EndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels: { severity: critical, sla: uptime }
        annotations:
          summary: "{{ $labels.instance }} is failing health checks"
          runbook: docs/runbooks/incident-response.md

      - alert: AvailabilityBudgetLow
        expr: sla:probe_success:ratio_30d < 0.996
        for: 15m
        labels: { severity: warning, sla: uptime }
        annotations:
          summary: "30-day availability {{ $value | humanizePercentage }} - approaching 99.5% SLA"

      - alert: ResponseTimeP95High
        expr: sla:http_request_duration_seconds:p95_5m > 0.18
        for: 5m
        labels: { severity: warning, sla: response-time }
        annotations:
          summary: "p95 latency for {{ $labels.service }} is {{ $value | humanizeDuration }} (SLA 200 ms)"

      - alert: LoadBalancerCapacityHigh
        expr: sla:haproxy_session_utilisation:ratio > 0.80
        for: 10m
        labels: { severity: warning, sla: lb-capacity }
        annotations:
          summary: "HAProxy {{ $labels.proxy }} at {{ $value | humanizePercentage }} of session limit (SLA <= 85%)"

      - alert: ErrorBudgetBurn
        expr: sum(increase(http_requests_total{status=~"5.."}[24h])) > 8
        for: 5m
        labels: { severity: warning, sla: errors }
        annotations:
          summary: "{{ $value }} server errors in the last 24h (SLA <= 10/day)"

      - alert: InterRegionLatencyHigh
        expr: avg_over_time(probe_icmp_duration_seconds{phase="rtt"}[10m]) > 0.09
        for: 10m
        labels: { severity: warning, sla: latency }
        annotations:
          summary: "RTT on {{ $labels.path }} is {{ $value | humanizeDuration }} (SLA 100 ms)"

  - name: capacity
    rules:
      - alert: HostCpuHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 70
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "CPU on {{ $labels.instance }} above 70% - scale out or up"

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 80
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Memory on {{ $labels.instance }} above 80%"

      - alert: InterfaceErrors
        expr: rate(ifInErrors[5m]) > 1 or rate(ifOutErrors[5m]) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Interface errors on {{ $labels.instance }} {{ $labels.ifDescr }}"

      - alert: HAProxyBackendDown
        expr: haproxy_backend_active_servers == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "All servers down in backend {{ $labels.proxy }}"
