route:
  receiver: noc-email
  group_by: [alertname, sla]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: noc-pager
      repeat_interval: 30m

receivers:
  - name: noc-email
    email_configs:
      - to: noc@example.com
        from: alertmanager@example.com
        smarthost: smtp.example.com:587
        auth_username: alertmanager@example.com
        auth_password_file: /etc/alertmanager/smtp_password
        send_resolved: true

  - name: noc-pager
    webhook_configs:
      - url: http://10.10.100.40:9095/pager
        send_resolved: true

inhibit_rules:
  - source_matchers: [alertname="EndpointDown"]
    target_matchers: [sla="response-time"]
    equal: [instance]
