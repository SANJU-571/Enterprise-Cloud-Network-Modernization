[project]
name = "enterprise-cloud-network-modernization"
version = "1.0.0"
description = "Hybrid AWS + on-prem enterprise network modernization: IaC, network configs, SLA monitoring and DR tooling"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
